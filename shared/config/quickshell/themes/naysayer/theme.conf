name="Naysayer"
# Naysayer supplies its palette through the managed gtk.css override rather
# than a complete named GTK theme.  Use a real dark provider as its base so
# GTK consumers (including Floorp) do not silently retain the previous theme.
gtk_theme="Adwaita-dark"
emacs_theme="naysayer"
jetbrains_theme="naysayer88 (exp ui)"
